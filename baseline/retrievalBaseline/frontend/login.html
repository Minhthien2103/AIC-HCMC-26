<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Session</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        .login-container {
            background-color: #131c2e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #243049;
            min-width: 340px;
        }
        h1 {
            text-align: center;
            color: #60a5fa;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            margin: 0.5rem 0;
            padding: 0.75rem;
            background-color: #0b1120;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        button {
            margin-top: 1rem;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .dev-btn {
            background-color: #334155;
            margin-top: 0.6rem;
            color: #cbd5e1;
        }
        .dev-btn:hover {
            background-color: #475569;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>AI Challenge 2026</h1>
        <div class="subtitle">Đăng nhập tài khoản DRES hoặc chọn Chế độ Dev</div>
        <form id="login-form">
            <input type="text" id="username" placeholder="Tên đăng nhập (Username)" required>
            <input type="password" id="password" placeholder="Mật khẩu (Password)" required>
            <button type="submit" id="login-button">Đăng nhập DRES</button>
            <button type="button" id="dev-button" class="dev-btn">Dev Mode (Bỏ qua đăng nhập)</button>
        </form>
    </div>

    <script src="src/scripts/config.js"></script>
    <script>
        document.getElementById('dev-button').addEventListener('click', function() {
            localStorage.setItem('userName', 'DevUser');
            localStorage.setItem('contestSessionID', 'dev_session_id');
            localStorage.setItem('evaluationID', 'dev_evaluation_id');
            window.location.href = 'index.html';
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const dresBase = (window.CONFIG && window.CONFIG.DRES_BASE) || window.DRES_BASE || "https://eventretrieval.one";

            try {
                const loginURL = `${dresBase}/api/v2/login`;
                const loginResponse = await fetch(loginURL, {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        'username': username,
                        'password': password
                    })
                });

                if (!loginResponse.ok) {
                    throw new Error(`Login failed with status: ${loginResponse.status}`);
                }

                const loginData = await loginResponse.json();
                const contestSessionID = loginData.sessionId;

                localStorage.setItem('userName', username);
                localStorage.setItem('contestSessionID', contestSessionID);

                const evaluationURL = `${dresBase}/api/v2/client/evaluation/list?session=${contestSessionID}`;
                const evaluationResponse = await fetch(evaluationURL, {
                    method: "GET"
                });

                if (!evaluationResponse.ok) {
                    throw new Error('Failed to fetch evaluation data');
                }

                const evaluationData = await evaluationResponse.json();
                if (Array.isArray(evaluationData) && evaluationData.length > 0) {
                    localStorage.setItem('evaluationID', evaluationData[0].id);
                } else if (evaluationData.id) {
                    localStorage.setItem('evaluationID', evaluationData.id);
                } else {
                    localStorage.setItem('evaluationID', 'default_eval');
                }

                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error during login process:', error);
                alert('Login failed: ' + error.message + '\nTip: Click "Dev Mode (Skip Login)" for offline development.');
            }
        });
    </script>
</body>
</html>
